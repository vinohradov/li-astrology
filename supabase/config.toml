# Supabase Edge Functions config
# Generated for per-function JWT settings. Apply via `supabase functions deploy`
# or the Supabase dashboard (Edge Functions → function → Settings).

[functions.create-payment]
# Both web (anon JWT) and bot (sb_secret_ API key) call this function.
# The bot's key is not a JWT, so verify_jwt=true rejects it. The function
# validates course slug / price / promo internally, so disabling JWT
# verification only exposes "create an invoice for a real course".
verify_jwt = false

[functions.wfp-callback]
# WayForPay does not send JWT — we verify its HMAC_MD5 signature inside.
verify_jwt = false

[functions.mono-callback]
# Monobank sends an X-Sign ECDSA signature in the header, not a JWT.
verify_jwt = false

[functions.reconcile-payments]
# Called manually as a fallback when webhooks fail to arrive.
verify_jwt = false

[functions.tg-auth]
# Called before the user has a session; the Telegram Login hash is the credential.
verify_jwt = false

[functions.claim-order]
# The caller's session token is verified inside with auth.getUser(); the gateway
# verify_jwt check does not support the project's asymmetric JWT signing keys.
verify_jwt = false
